<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Weather</h1>
    <form id="search">
      <label for="city" class="sr">City name</label>
      <input id="city" type="text" placeholder="Search a city, e.g. Chennai" required>
      <button type="submit">Search</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="current" hidden>
      <h2 id="place"></h2>
      <p class="temp"><span id="temp"></span>&deg;C</p>
      <p id="desc"></p>
      <p class="meta">Wind <span id="wind"></span> km/h</p>
    </section>

    <section id="forecast" class="forecast" hidden></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
